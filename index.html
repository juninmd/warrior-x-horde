<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crowd Runner - Warrior x Horde</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    
    .game-title {
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
      margin-bottom: 10px;
    }
    
    .game-subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 15px;
    }
    
    #gameCanvas {
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: #2c3e50;
      touch-action: none;
    }
    
    .controls-hint {
      color: #888;
      font-size: 12px;
      margin-top: 15px;
      text-align: center;
    }
    
    @media (max-width: 500px) {
      .game-title {
        font-size: 22px;
      }
      
      .controls-hint {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <h1 class="game-title">⚔️ Crowd Runner ⚔️</h1>
  <p class="game-subtitle">Multiplique seu exército e destrua as hordas!</p>
  
  <canvas id="gameCanvas" width="480" height="800"></canvas>
  
  <div class="controls-hint">
    <p>Arraste para mover | A/D ou setas para mover</p>
    <p>Escolha os gates verdes/azuis para multiplicar seu exercito!</p>
  </div>

  <script type="module" src="./src/game.ts"></script>
</body>

</html>
