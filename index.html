<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crowd Runner - Warrior x Horde</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      touch-action: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      padding: 5px;
    }

    .game-title {
      color: #fff;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: bold;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
      margin-bottom: 5px;
      text-align: center;
    }

    .game-subtitle {
      color: #aaa;
      font-size: clamp(10px, 3vw, 14px);
      margin-bottom: 8px;
      text-align: center;
    }

    #gameCanvas {
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: #2c3e50;
      touch-action: none;
      max-width: 100%;
      max-height: calc(100vh - 150px);
      max-height: calc(100dvh - 150px);
    }

    .controls-hint {
      color: #888;
      font-size: clamp(9px, 2.5vw, 12px);
      margin-top: 8px;
      text-align: center;
      line-height: 1.4;
    }

    /* Landscape mode on mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      .game-title, .game-subtitle {
        display: none;
      }

      .controls-hint {
        display: none;
      }

      #gameCanvas {
        max-height: calc(100vh - 70px);
        max-height: calc(100dvh - 70px);
      }

      .game-container {
        padding: 5px;
      }
    }

    /* Small phones */
    @media (max-width: 380px) {
      .game-title {
        font-size: 16px;
      }

      .game-subtitle {
        font-size: 10px;
        margin-bottom: 5px;
      }

      .controls-hint {
        font-size: 9px;
        margin-top: 5px;
      }
    }

    /* Large tablets/desktop */
    @media (min-width: 768px) {
      #gameCanvas {
        max-height: calc(100vh - 150px);
        max-height: calc(100dvh - 150px);
      }
    }
  </style>
</head>

<body>
  <div class="game-container">
    <h1 class="game-title">⚔️ Crowd Runner ⚔️</h1>
    <p class="game-subtitle">Multiplique seu exército e destrua as hordas!</p>

    <canvas id="gameCanvas" width="480" height="800"></canvas>

    <div class="controls-hint">
      <p>Arraste para mover | A/D ou setas para mover</p>
      <p>Escolha os gates verdes/azuis para multiplicar seu exercito!</p>
    </div>
  </div>

  <script type="module" src="./src/game.ts"></script>
</body>

</html>
